name: Build Lenovo Smart Frame APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Required by Gradle 8, compiles down to Java 8 for Android 8.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Sideloading
        run: cp app/build/outputs/apk/debug/app-debug.apk LenovoSmartFrameCustom.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LenovoSmartFrameCustom-APK
          path: LenovoSmartFrameCustom.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "Lenovo Smart Frame v3.0 (Android 8.1 Java-8 Fixed #${{ github.run_number }})"
          files: LenovoSmartFrameCustom.apk
